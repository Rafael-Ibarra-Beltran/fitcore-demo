name = "fitcore-automations"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Cinco disparadores, el máximo del plan gratuito. Horas en UTC (ver src/index.ts).
[triggers]
crons = ["0 16 * * *", "*/15 * * * *", "0 17 * * *", "0 15 * * *", "0 14 * * 1"]

[vars]
CORE_URL = "https://api.fitcore.quirelia.mx"

# La clave de servicio es secreta: wrangler secret put SERVICE_KEY
