[project]
name = "fitcore-vision"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mediapipe>=1.2",  # trae opencv-contrib-python: no declarar otra variante de opencv, se pisarían
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["model: usa el modelo real (se descarga la primera vez); se omite salvo RUN_MODEL_TEST=1"]
