[project]
name = "fitcore-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "litellm>=1.50",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyyaml>=6",
  "tenacity>=9.2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
